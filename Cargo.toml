[package]
name = "lau-homotopy-type"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SuperInstance/lau-homotopy-type"
description = "Homotopy Type Theory library: cubical types, path types, identity types, transport, equivalences, higher inductive types, and HoTT-based compiler verification"

[dependencies]
serde = { version = "1", features = ["derive"] }
nalgebra = "0.33"

[dev-dependencies]
serde_json = "1"
